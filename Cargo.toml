[package]
name = "agentstow"
version = "2.0.6"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "DEPRECATED — agentstow is now agent-sync: install the `agent-sync-sh` crate instead. Canonical configs, fanned out to all your AI coding agents from the Commons, the canonical ~/.agents directory"
repository = "https://github.com/agentstow/agentstow"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "skills", "symlink"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
toml_edit = "0.25.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
toml = "1.1.4"

[profile.release]
strip = true
lto = true
