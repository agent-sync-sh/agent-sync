name: ci

# Runs the test suite and the lints on every pull request and every push to
# main. release.yml deliberately does not: it fires on release tags, on manual
# dispatch, and on pull requests touching a narrow paths filter (npm/, scripts/,
# Cargo.toml, itself). Nothing in that filter covers src/ or tests/, so before
# this workflow existed a pull request rewriting the whole crate ran zero checks
# and a tag published to four registries without ever compiling the test
# suite. None of crates.io, npm or PyPI lets a version be re-uploaded, so an
# untested publish is not something a follow-up commit can take back.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run's answer worthless, and
# the matrix is three runners wide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          # The full suite runs here, integration tests included. Creating a
          # symlink on Windows needs Developer Mode or elevation, and the
          # runner is administrative, so it works; a box that is neither would
          # fail the fixtures with OS error 1314.
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the rust toolchain
        run: |
          # Pinned the same way release.yml pins it: Cargo.toml declares edition
          # 2024 and rust-version 1.97, so a stale preinstalled toolchain fails
          # with a confusing message rather than an honest one.
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
          rustc --version
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the floor toolchain, and prove it is the one in use
        run: |
          # Cargo.toml publishes rust-version = "1.97" to crates.io, where it is
          # a promise: cargo refuses to build the crate on anything older, and
          # anyone on exactly 1.97 has to succeed. Nothing verified that promise
          # until this job — the other legs all run stable, so the first use of
          # a newer feature would have made the published floor a lie without
          # failing anything.
          #
          # The toolchain is named per command with `+1.97`, not selected with
          # `rustup default`. rust-toolchain.toml pins the stable channel and
          # outranks the default setting, so the first version of this job set
          # the default to 1.97, compiled on stable, and passed — a green tick
          # proving nothing. `+toolchain` is the one form that outranks the file.
          rustup toolchain install 1.97 --profile minimal
          rustc +1.97 --version
          # Asserted, not just printed: the failure mode this job exists to
          # catch is silently checking the wrong compiler, and that looks
          # exactly like success.
          rustc +1.97 --version | grep -q '^rustc 1\.97\.' || {
            echo "::error::MSRV job is not running 1.97 — it would pass vacuously"
            exit 1
          }
      # check, not test, and no --all-targets: the floor is a promise about the
      # library and binary a consumer builds. A dev-dependency raising its own
      # MSRV says nothing about that promise and should not fail this job.
      - run: cargo +1.97 check --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup default stable
      - run: cargo fmt --all --check
