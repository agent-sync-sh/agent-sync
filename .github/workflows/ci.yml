name: ci

# Runs the test suite and the lints on every pull request and every push to
# main. release.yml deliberately does not: it fires on release tags, on manual
# dispatch, and on pull requests touching a narrow paths filter (npm/, scripts/,
# Cargo.toml, itself). Nothing in that filter covers src/ or tests/, so before
# this workflow existed a pull request rewriting the whole crate ran zero checks
# and a tag published to four registries without ever compiling the 319-test
# suite. None of crates.io, npm or PyPI lets a version be re-uploaded, so an
# untested publish is not something a follow-up commit can take back.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run's answer worthless, and
# the matrix is three runners wide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            scope: --all-targets
            test_args: ""
            run_tests: true
          - name: macos
            os: macos-latest
            scope: --all-targets
            test_args: ""
            run_tests: true
          - name: windows
            os: windows-latest
            # Executes the unit tests, which are the ones that cover every
            # cfg(windows) branch — link.rs flavour and the 1314 rewrite,
            # lock.rs share-mode contention, write.rs mode reporting, doctor.rs
            # probe. Clippy still spans --all-targets, so the ported harness and
            # all 17 integration files are compile- and lint-checked here even
            # though they are not yet run.
            #
            # The integration suite is NOT green on Windows yet: 260 of 278 pass
            # on a real Windows 11 box, and 18 fail across revert, the XDG
            # config paths and the legacy-dir prune. Those are genuine
            # behavioural gaps, not separator noise, so they are left visible as
            # work rather than hidden behind #[ignore] — turning this leg on
            # before they are fixed would only make main permanently red.
            #
            # Symlink creation on Windows needs Developer Mode or elevation;
            # the runner is administrative, so it works there.
            scope: --all-targets
            test_args: --lib
            run_tests: true
    steps:
      - uses: actions/checkout@v7
      - name: install the rust toolchain
        run: |
          # Pinned the same way release.yml pins it: Cargo.toml declares edition
          # 2024 and rust-version 1.97, so a stale preinstalled toolchain fails
          # with a confusing message rather than an honest one.
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
          rustc --version
      - name: clippy
        run: cargo clippy --locked ${{ matrix.scope }} -- -D warnings
      - name: test
        if: ${{ matrix.run_tests }}
        run: cargo test --locked ${{ matrix.test_args }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup default stable
      - run: cargo fmt --all --check
