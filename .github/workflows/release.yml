name: release

# Cross-builds every supported target once, then packages that same binary
# every way it ships — npm packages, PyPI wheels, release tarballs, and the
# Homebrew formula — proving each installs before anything is published. On a
# v* tag push, and only then, the publish jobs push to crates.io, npm and PyPI
# via OIDC trusted publishing: no long-lived tokens, credentials minted per
# run. The one-time registry-side setup and the manual fallback live in
# docs/release-runbook.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "npm/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - "Cargo.toml"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            runner: macos-latest
            bin: agentstow
            run_check: true
          - target: darwin-x64
            triple: x86_64-apple-darwin
            # Built on Apple silicon: rustc cross-compiles the x86_64 Mac target
            # with the SDK already on the runner, and GitHub has retired the
            # macos-13 Intel image — a job asking for it queues forever.
            runner: macos-latest
            bin: agentstow
            run_check: true
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bin: agentstow
            run_check: true
          - target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            bin: agentstow
            run_check: true
          - target: win32-x64
            triple: x86_64-pc-windows-msvc
            runner: windows-latest
            bin: agentstow.exe
            run_check: true
          - target: win32-arm64
            triple: aarch64-pc-windows-msvc
            # Cross-compiled on the x64 image with the MSVC arm64 cross tools,
            # like darwin-x64 above — except an x64 host cannot execute the
            # result, so the run check is skipped for this target only.
            runner: windows-latest
            bin: agentstow.exe
            run_check: false
    steps:
      - uses: actions/checkout@v7
      - name: install the rust toolchain
        run: |
          # Cargo.toml declares edition 2024 and rust-version 1.97, so a stale
          # preinstalled toolchain would fail with a confusing message.
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.triple }}
          rustc --version
      - name: build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: the binary runs
        if: ${{ matrix.run_check }}
        run: ./target/${{ matrix.triple }}/release/${{ matrix.bin }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.triple }}/release/${{ matrix.bin }}
          if-no-files-found: error

  package:
    name: assemble and verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: put each binary where the assembler expects it
        run: |
          set -euo pipefail
          declare -A TRIPLE=(
            [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [win32-x64]=x86_64-pc-windows-msvc
            [win32-arm64]=aarch64-pc-windows-msvc
          )
          for target in "${!TRIPLE[@]}"; do
            exe=""; case "$target" in win32-*) exe=".exe" ;; esac
            dir="target/${TRIPLE[$target]}/release"
            mkdir -p "$dir"
            cp "artifacts/binary-$target/agentstow$exe" "$dir/agentstow$exe"
            chmod +x "$dir/agentstow$exe"
          done
      - name: assemble the npm packages
        run: scripts/build-npm.sh dist
      - name: every package is present
        run: |
          set -euo pipefail
          for expected in agentstow darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            test -f "dist/$expected/package.json" || { echo "missing dist/$expected"; exit 1; }
          done
          test -x dist/linux-x64/bin/agentstow
      - name: no install hooks
        run: |
          if grep -RlE '"(postinstall|preinstall|install)"' dist; then
            echo "packages must not run code on install"; exit 1
          fi
      - name: pack, install offline, and run
        run: |
          set -euo pipefail
          mkdir -p tarballs consumer
          for dir in dist/*; do (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"); done
          cd consumer && npm init -y >/dev/null
          npm install --offline --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/tarballs/agentstow-linux-x64-*.tgz \
            "$GITHUB_WORKSPACE"/tarballs/agentstow-[0-9]*.tgz
          ./node_modules/.bin/agentstow --version
      - name: dry-run publish
        run: for dir in dist/*; do (cd "$dir" && npm publish --dry-run); done
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist

  crate:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - run: cargo publish --dry-run --locked

  wheels:
    name: assemble and verify the wheels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: put each binary where the assembler expects it
        run: |
          set -euo pipefail
          declare -A TRIPLE=(
            [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [win32-x64]=x86_64-pc-windows-msvc
            [win32-arm64]=aarch64-pc-windows-msvc
          )
          for target in "${!TRIPLE[@]}"; do
            exe=""; case "$target" in win32-*) exe=".exe" ;; esac
            dir="target/${TRIPLE[$target]}/release"
            mkdir -p "$dir"
            cp "artifacts/binary-$target/agentstow$exe" "$dir/agentstow$exe"
            chmod +x "$dir/agentstow$exe"
          done
      - name: assemble the wheels
        run: scripts/build-wheels.py wheelhouse
      - name: six platform wheels, plus the fallback
        run: |
          set -euo pipefail
          count="$(ls wheelhouse/*.whl | wc -l)"
          if [ "$count" -ne 7 ]; then
            echo "expected 7 wheels, built $count"; ls wheelhouse; exit 1
          fi
          # Its absence is silent: supported platforms keep working and only
          # unsupported ones regress, so assert it rather than eyeball the list.
          test -f wheelhouse/agentstow-*-py3-none-any.whl
      - name: the fallback explains itself rather than crashing
        run: |
          set -euo pipefail
          python -m venv /tmp/fallbacktest
          /tmp/fallbacktest/bin/pip install --no-index wheelhouse/agentstow-*-py3-none-any.whl
          out="$(/tmp/fallbacktest/bin/agentstow 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q 'no prebuilt binary' || { echo "fallback message missing"; exit 1; }
          echo "$out" | grep -q 'cargo install agent-sync-sh' || { echo "no way forward given"; exit 1; }
      - name: the linux wheel installs and runs
        # This runner is linux-x64, so the manylinux wheel is the one target
        # whose install can actually be exercised here. It is also the check
        # that would have caught a wheel whose binary lands non-executable.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --no-index wheelhouse/agentstow-*manylinux*x86_64.whl
          test -x /tmp/wheeltest/bin/agentstow
          /tmp/wheeltest/bin/agentstow --version
      - name: metadata passes the check PyPI runs on upload
        run: |
          python -m pip install --quiet twine
          python -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse

  guard:
    name: tag matches the crate version
    # Any run sitting on a v* tag, pushed or dispatched — the registry publish
    # jobs below stay push-only, but the binary and formula jobs can be
    # replayed at a tag without moving it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  release:
    name: attach the binaries to the GitHub Release
    # The six cross-builds used to reach users only through npm, which made npm
    # a single point of failure for everyone not building from source. They are
    # already built by the time this runs; attaching them costs one job and is
    # what the Homebrew tap installs from.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload to it; the repo default is read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: one archive per target, plus the checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist stage
          # tar for the unix targets — the archive holds the bare binary, which
          # is what the formula's `bin.install "agentstow"` expects.
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            install -m 755 "artifacts/binary-$target/agentstow" stage/agentstow
            tar -C stage -czf "dist/agentstow-$version-$target.tar.gz" agentstow
            rm -f stage/agentstow
          done
          for target in win32-x64 win32-arm64; do
            install -m 755 "artifacts/binary-$target/agentstow.exe" stage/agentstow.exe
            (cd stage && zip -q "$GITHUB_WORKSPACE/dist/agentstow-$version-$target.zip" agentstow.exe)
            rm -f stage/agentstow.exe
          done
          # Named glob, not `*`: SHA256SUMS.txt must not checksum itself.
          (cd dist && sha256sum agentstow-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: create the release, or replace the assets on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  tap:
    name: point the Homebrew formula at this release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the regenerated formula back to main
    steps:
      - uses: actions/checkout@v7
        with:
          # The tap serves whatever is on main; the tag is a detached commit.
          ref: main
          # This job commits and rebases, and the default shallow clone makes
          # `git pull --rebase` unreliable against a main that moved.
          fetch-depth: 0
      - name: regenerate the formula from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-formula.sh "$GITHUB_REF_NAME"
      - name: commit, unless nothing moved
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/agentstow.rb; then
            echo "the formula already points at $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentstow.rb
          git commit -m "Homebrew formula: $GITHUB_REF_NAME"
          # A human may have pushed to main while the release was building.
          git pull --rebase origin main
          git push origin main

  publish-crate:
    name: publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, crate, guard]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange with crates.io — see the runbook
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish, unless this version is already up
        # The skip makes a re-run after a partial release idempotent —
        # cargo publish hard-fails on a version that already exists.
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if curl -sf https://index.crates.io/ag/en/agentstow | grep -q "\"vers\":\"$version\""; then
            echo "agentstow $version is already on crates.io; skipping"
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, crate, guard]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange with npm — see the runbook
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm is new enough for trusted publishing
        run: |
          # OIDC-based publishing needs npm >= 11.5.1; Node 24 bundles it,
          # this asserts rather than assumes.
          v="$(npm --version)"
          printf '%s\n11.5.1\n' "$v" | sort -V | head -1 | grep -qx '11.5.1' \
            || { echo "npm $v is older than 11.5.1"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist
      - name: restore the executable bits the artifact round-trip strips
        # download-artifact does not preserve file modes, and the platform
        # binary is not a declared bin entry, so npm never repairs it at
        # install time — 1.1.2 shipped a 644 binary this way. Running the one
        # binary this runner can execute proves the repair rather than
        # assuming it.
        run: |
          set -euo pipefail
          chmod +x dist/*/bin/agentstow* dist/agentstow/bin/agentstow.js
          dist/linux-x64/bin/agentstow --version
      - name: platform packages first, then the launcher
        # The launcher declares the platform packages as optional
        # dependencies; publishing it first leaves a window where installing
        # it resolves nothing and the binary is missing. Already-published
        # packages are skipped so a re-run after a partial release is
        # idempotent rather than an EPUBLISHCONFLICT.
        run: |
          set -euo pipefail
          publish() {
            local name version
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry; skipping"
            else
              (cd "$1" && npm publish --access public)
            fi
          }
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            publish "dist/$target"
          done
          publish dist/agentstow

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, crate, guard, wheels]
    runs-on: ubuntu-latest
    # PyPI binds its trust entry to this environment name, and the environment
    # itself only accepts v* tags — so a workflow run on a branch cannot mint a
    # PyPI credential even though it lives in the same file. crates.io and npm
    # leave the environment blank; PyPI is the one registry that recommends it,
    # and it is the newest trust entry, so it starts tight.
    environment: pypi
    permissions:
      id-token: write # OIDC exchange with PyPI — see the runbook
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run after a partial release idempotent, the way the npm
          # and crates.io jobs skip versions already on their registries.
          skip-existing: true
